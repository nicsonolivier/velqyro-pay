# Serviços locais de desenvolvimento. Nenhuma credencial aqui vale para produção.
services:
  postgres:
    image: postgres:16-alpine
    container_name: velqyro-postgres
    environment:
      POSTGRES_USER: velqyro
      POSTGRES_PASSWORD: velqyro_dev
      POSTGRES_DB: velqyro_dev
    ports:
      - "5432:5432"
    volumes:
      - velqyro_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velqyro -d velqyro_dev"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  velqyro_pg:
